# 연구 공통 설정 (본연구 Step 2~)
project:
  name: korea_economic_issue_regime
  # 분석 창: 빅카인즈 코퍼스 보유 기간에 맞춤 (2021-01 ~ 2026-07)
  study_period_start: "2021-01-01"
  study_period_end: "2026-07-31"
  # 지표·검색 데이터는 더 길게 받아 둔다 (차분·시차·강건성용 lead-in)
  data_buffer_start: "2016-01-01"

paths:
  raw_bigkinds: data/raw/bigkinds
  raw_ecos: data/raw/ecos
  raw_datalab: data/raw/datalab
  processed_corpus: data/processed/corpus
  processed_panel: data/processed/panel
  processed_regimes: data/processed/regimes
  processed_reactions: data/processed/reactions

# 기대 입력 스키마 (컬럼명 기준)
schemas:
  news:
    required: [date, title, content]
    optional: [source, link, media]
  ecos:
    required: [date, CCSI, KOSPI, USD_KRW, BASE_RATE, CPI]
    optional: [collected_at]
    indicators: [CCSI, KOSPI, USD_KRW, BASE_RATE, CPI]
  # datalab_regime_* (대분류) · datalab_sub_* (세부) 공통 스키마
  # score는 요청 내 상대값, score_rel = score / anchor_score 가 요청 간 비교용
  datalab:
    required: [date, regime, group, score, anchor_score, score_rel]
    optional: [keywords, period_start, period_end, time_unit, collected_at]

# 2026-10-01 재정의. 키워드 7라벨을 월별 비중 상관·상위 어휘 겹침·질량 비로 고친 것.
# 검색 데이터랩 묶음(물가·금리·…·증시실적)은 api/datalab_keyword_sets.py 에 그대로 있다.
regimes:
  labels: [금리·물가, 부동산, 가계대출, 대외통상, AI반도체, 시황, 기업실적, 자본거래]
  # 패널 컬럼명·회귀식에 쓰는 ASCII 약칭. 라벨과 1:1로 유지할 것.
  slugs:
    금리·물가: macro
    부동산: realestate
    가계대출: hhdebt
    대외통상: trade
    AI반도체: aichip
    시황: market
    기업실적: earnings
    자본거래: capital
  freq: M  # 월 단위
  # 다중 활성 국면 임계값 (표본 내 z점수 0.5 이상 활성화)
  active_z_threshold: 0.5

topic_model:
  method: nmf  # nmf | lda | bertopic(추후)
  n_topics: 14
  random_state: 42

analysis:
  event_window_months: 3
  min_articles_per_month: 30
